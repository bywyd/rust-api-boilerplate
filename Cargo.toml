[package]
name = "rust-api-boilerplate"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "api"
path = "src/main.rs"

[[bin]]
name = "worker"
path = "src/bin/worker.rs"

[[bin]]
name = "updater"
path = "src/bin/updater.rs"

[[bin]]
name = "installer"
path = "src/bin/installer.rs"

[[bin]]
name = "uninstaller"
path = "src/bin/uninstaller.rs"

[dependencies]
tokio = { version = "1.36", features = ["full"] }

# === Web Framework ===
actix-web = "4.5"
actix-cors = "0.7"
actix-multipart = "0.7.2"
actix-files = "0.6"
actix-governor = "0.7"
# WebSockets for actix-web 4 (actor-free API)
actix-ws = "0.4"
# Cheap-to-clone UTF-8 string backed by `Bytes` — one encoded frame fans out
# to thousands of sockets without re-allocating per recipient.
bytestring = "1.5"

# === Serialization ===
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
serde_repr = "0.1"

# === Environment / Config ===
dotenvy = "0.15"
config = { version = "0.15.22", features = ["yaml"] }

# === Logging / Tracing ===
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"] }
tracing-appender = "0.2"

# === Database (SQLx) ===
# Active: mysql. To add postgres: append "postgres" to features below and enable sea-orm sqlx-postgres.
# To add sqlite: append "sqlite" to features below and enable sea-orm sqlx-sqlite.
rust_decimal = { version = "1", features = ["serde"] }
sqlx = { version = "0.8.6", features = [
    "runtime-tokio-rustls",
    "mysql",
    # "postgres",
    # "sqlite",
    "chrono",
    "uuid",
    "json",
    "migrate",
    "rust_decimal",
] }

# === HTTP Client ===
reqwest = { version = "0.13.3", features = ["json", "rustls"] }

# === Validation ===
validator = { version = "0.20", features = ["derive"] }

# === Authentication / Security ===
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
argon2 = "0.5"
uuid = { version = "1.7", features = ["v4", "serde"] }

# === Dates ===
chrono = { version = "0.4", features = ["serde"] }

# === Error Handling ===
thiserror = "2.0.18"
anyhow = "1.0"

# Cache (L1 â in-process)
moka = { version = "0.12", features = ["future"] }
dashmap = "6.1.0"

# Redis (L2 Cache / PubSub â optional at runtime, set cache.redis.enabled = true in config)
redis = { version = "1.0.3", features = ["tokio-comp"] }
deadpool-redis = "0.23.0"

# === Job Queue / Background Tasks ===
async-channel = "2.2"
tokio-util = { version = "0.7", features = ["time"] }

# === Cron Scheduling ===
cron = "0.15"

# Async traits
async-trait = "0.1"

# === System Info ===
sysinfo = "0.38"

# === Utils ===
once_cell = "1.19"
futures = "0.3"
bytes = "1.5"
parking_lot = "0.12"
num_cpus = "1.16"
slug = "0.1.6"
num-traits = "0.2.19"

# === Self-updater ===
zip = "8.6.0"
sha2 = "0.11"
semver = "1.0"

# === Installer ===
dialoguer = "0.11"

# === Email ===
lettre = { version = "0.11", features = ["tokio1-native-tls"] }

# === ORM ===
sea-orm = { version = "1.1.19", features = [
    "sqlx-mysql",
    # "sqlx-postgres",   # uncomment to enable PostgreSQL
    # "sqlx-sqlite",     # uncomment to enable SQLite
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-json",
    "with-rust_decimal",
    "with-uuid",
] }