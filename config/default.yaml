server:
  host: "127.0.0.1"
  port: 8080
  workers: 0 # 0 = auto-detect CPU count

database:
  url: "mysql://root:password@localhost:3306/app"
  max_connections: 10
  min_connections: 2
  connect_timeout_seconds: 10

cache:
  local:
    max_capacity: 10000
    ttl_seconds: 300
  redis:
    enabled: false
    url: "redis://localhost:6379"
    pool_size: 10

logging:
  level: "info"
  format: "pretty" # "pretty" | "json"
  file_enabled: false
  file_path: "./logs"

http_client:
  timeout_seconds: 30
  connect_timeout_seconds: 10

auth:
  jwt_secret: "change_me_in_production_use_a_long_random_string"
  jwt_expiry_hours: 24

cors:
  # List exact origins that may make cross-origin requests.
  # Use ["*"] only for fully public, read-only APIs — never with allow_credentials: true.
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "PATCH"
    - "DELETE"
    - "OPTIONS"
  allowed_headers:
    - "Content-Type"
    - "Authorization"
    - "Accept"
    - "X-Request-Id"
  expose_headers:
    - "X-Request-Id"
  max_age_seconds: 3600
  allow_credentials: true
