server:
  host: "127.0.0.1"
  port: 8080
  workers: 0 # 0 = auto-detect CPU count

database:
  url: "mysql://root:password@localhost:3306/app"
  max_connections: 10
  min_connections: 2
  connect_timeout_seconds: 10

cache:
  local:
    max_capacity: 10000
    ttl_seconds: 300
  redis:
    enabled: false
    url: "redis://localhost:6379"
    pool_size: 10

logging:
  level: "info"
  format: "pretty" # "pretty" | "json"
  file_enabled: true
  file_path: "./logs"
  file_rotation: "daily"   # "daily" | "hourly" | "never"
  file_retention_days: 7   # delete log files older than N days (0 = keep forever)
  http_request_logging:
    enabled: false
    log_request_body: false
    log_response_body: false

http_client:
  timeout_seconds: 30
  connect_timeout_seconds: 10

auth:
  jwt_secret: "change_me_in_production_use_a_long_random_string"
  jwt_expiry_hours: 24

cors:
  # List exact origins that may make cross-origin requests.
  # Use ["*"] only for fully public, read-only APIs — never with allow_credentials: true.
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "PATCH"
    - "DELETE"
    - "OPTIONS"
  allowed_headers:
    - "Content-Type"
    - "Authorization"
    - "Accept"
    - "X-Request-Id"
  expose_headers:
    - "X-Request-Id"
  max_age_seconds: 3600
  allow_credentials: true

worker:
  # false = run worker as a separate binary: `cargo run --bin worker`
  # true  = run worker inline with the API server (convenient for small deployments)
  enabled: false
  concurrency: 4
  poll_interval_ms: 1000

queue:
  # "channel"  — in-memory, lost on restart (good for development)
  # "database" — MySQL-persisted, survives restarts (use in production)
  backend: "channel"
  max_retries: 3
  retry_delay_seconds: 60

scheduler:
  # Run the cron scheduler in-process. It dispatches jobs onto the queue on a
  # schedule; a worker (inline or standalone) still executes them.
  # In multi-instance deployments, enable this on exactly ONE instance to avoid
  # firing each schedule multiple times. Define schedules in src/app/jobs/schedule.rs.
  enabled: false

updater:
  # Master switch. Set to true to enable the self-update subsystem.
  enabled: false
  # URL of the remote version manifest JSON.
  # Schema: { version, release_notes, published_at, download_url, checksum_sha256, binary_name }
  check_url: "https://example.com/releases/latest/manifest.json"
  # true  — automatically download and apply updates when a new version is detected.
  # false — only record the new version and expose it via GET /api/updates/status.
  auto_update: false
  # Background check interval in seconds. 0 = disable background checker (manual only).
  check_interval_seconds: 3600
  # spawn      — the updater binary execs the new process directly after replacing the binary.
  # supervisor — the updater exits after replacing; rely on systemd/Docker to restart.
  restart_mode: "supervisor"
  # Overrides the compile-time CARGO_PKG_VERSION. Leave empty to use the compiled value.
  current_version: "0.1.0"

rate_limit:
  enabled: true
  # Named rules — reference these by key in router.rs via state.rate_limit.condition("rule-name").
  # Add as many rules as your API needs; they are built once at startup and shared across workers.
  rules:
    # General API routes: sustain 1 req/s, allow short bursts up to 60.
    default:
      seconds_per_request: 1
      burst_size: 60
    # Login / auth routes: max 1 req per 20 s with a small burst (brute-force protection).
    auth:
      seconds_per_request: 20
      burst_size: 5

email:
  enabled: false
  smtp_host: "smtp.example.com"
  smtp_port: 587
  smtp_username: ""
  smtp_password: ""
  from_address: "noreply@example.com"
  from_name: "App"
  # TLS mode: "starttls" (port 587), "tls" (port 465), "none" (dev only)
  tls_mode: "starttls"
